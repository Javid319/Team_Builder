<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hackcomp — Sign In</title>
  <link rel="stylesheet" href="/static/css/style.css"/>
</head>
<body>

<div class="auth-page">
  <div class="auth-card">

    <div class="auth-logo">
      <div class="logo-dot">⬡</div>
      <span>Hackcomp <sub>Platform</sub></span>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
      <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Create Account</div>
    </div>

    <!-- ── Login ── -->
    <div id="form-login">
      <h2 class="auth-heading">Welcome back</h2>
      <p class="auth-sub">Sign in to your account to continue</p>

      <div class="field">
        <label>Email</label>
        <input id="l-email" type="email" placeholder="you@example.com" autofocus/>
      </div>
      <div class="field">
        <label>Password</label>
        <input id="l-password" type="password" placeholder="Your password"/>
      </div>

      <button class="btn btn-primary btn-full" id="btn-login" style="margin-top:8px">
        Sign In
      </button>
      <div id="login-toast" class="toast"></div>
    </div>

    <!-- ── Register ── -->
    <div id="form-register" style="display:none">
      <h2 class="auth-heading">Create an account</h2>
      <p class="auth-sub">Get started with Hackcomp today</p>

      <div class="field">
        <label>Full Name</label>
        <input id="r-name" type="text" placeholder="Gokhul A"/>
      </div>
      <div class="field">
        <label>Email</label>
        <input id="r-email" type="email" placeholder="you@example.com"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input id="r-password" type="password" placeholder="Min. 8 characters"/>
      </div>

      <button class="btn btn-primary btn-full" id="btn-register" style="margin-top:8px">
        Create Account
      </button>
      <div id="register-toast" class="toast"></div>
    </div>

  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/auth.js"></script>
</body>
</html>
