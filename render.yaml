services:
  # ── Platform Backend ────────────────────────────────────────
  - type: web
    name: hackcomp-platform-backend
    runtime: python
    plan: free
    rootDir: platform_backend
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: APP_NAME
        value: "Hackathon Team Formation Platform"
      - key: APP_VERSION
        value: "1.0.0"
      - key: DEBUG
        value: "False"
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: UPLOAD_DIR
        value: uploads/resumes
      - key: AVATAR_DIR
        value: uploads/avatars
      - key: MAX_UPLOAD_SIZE_MB
        value: "5"
      - key: MAX_AVATAR_SIZE_MB
        value: "5"
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEY_2
        sync: false
      - key: GROQ_API_KEY_3
        sync: false
      - key: GROQ_API_KEY_4
        sync: false
      - key: GROQ_API_KEY_5
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  # ── Resume Engine ────────────────────────────────────────────
  - type: web
    name: hackcomp-resume-engine
    runtime: python
    plan: free
    rootDir: resume_engine/backend
    buildCommand: pip install -r ../requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10
      - key: LLM_ENDPOINT
        value: https://api.groq.com/openai/v1/chat/completions
      - key: LLM_MODEL
        value: openai/gpt-oss-20b
      - key: LLM_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
